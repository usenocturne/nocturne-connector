[package]
name = "nocturne-connector-windows"
version = "2.1.1"
description = "Windows tray host for Nocturne Connector"
authors = ["Nocturne"]
edition = "2021"
rust-version = "1.85"
build = "build.rs"

[lib]
name = "nocturne_connector_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Media_Control",
  "Media_MediaProperties",
  "Storage_Streams",
  "Devices_Bluetooth",
  "Devices_Bluetooth_Rfcomm",
  "Devices_Enumeration",
  "Win32_Devices_Bluetooth",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Networking_WinSock",
  "Win32_Security_Cryptography",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = { version = "0.61", package = "windows-core" }
